# Re-verifies every license URL against the bytes this repository builds from.
# Links are proven correct when written, but upstream can retag, rename or
# archive a repository afterwards, and no offline gate can see that. Scheduled
# rather than per pull request so link rot does not block unrelated work.

name: Third-Party Notices Links

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-links:
    name: Re-verify license URLs against upstream
    runs-on: linux-amd64-cpu4
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Get Golang version
      id: vars
      run: |
        GOLANG_VERSION=$(./hack/golang-version.sh)
        echo "GOLANG_VERSION=${GOLANG_VERSION##GOLANG_VERSION := }" >> $GITHUB_ENV
    - name: Install Go
      uses: actions/setup-go@v7
      with:
        go-version: ${{ env.GOLANG_VERSION }}
    - name: Setup Go Proxy
      id: setup-go-proxy
      uses: nv-gha-runners/setup-artifactory-go-proxy@main
    - name: Re-verify every license URL
      env:
        GOPROXY: ${{ steps.setup-go-proxy.outputs.goproxy-url }}
        URLS_OUTPUT: /tmp/license-urls-fresh.tsv
      run: |
        make go-licenses
        bash hack/verify-license-urls.sh
    - name: Compare against the committed map
      run: |
        if ! diff -u <(LC_ALL=C grep -v '^#' hack/license-urls.tsv) \
                     <(LC_ALL=C grep -v '^#' /tmp/license-urls-fresh.tsv); then
          echo "::error::A license URL no longer serves the bytes we build from. Upstream may have retagged or moved."
          exit 1
        fi
